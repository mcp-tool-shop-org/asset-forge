[workspace]
members = [
    "crates/ship-schema",
    "crates/ship-hull",
    "crates/ship-export",
    "crates/ship-testkit",
]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/mcp-tool-shop-org/asset-forge"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
